[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thundermax-assistant"
version = "0.1.0"
description = "Local-first, safety-gated assistive motorcycle tuning core"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
thundermax-assistant = "thundermax_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["thundermax_assistant*"]
