name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q thundermax_assistant tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Exercise the supported case
        run: python -m thundermax_assistant.cli examples/decel_pop_heat_soak.json --audit-db /tmp/thundermax-audit.sqlite3
