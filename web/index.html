<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThunderMax Tuning Assistant</title>
<style>
  :root { --bg:#0e1116; --panel:#171c24; --line:#263041; --ink:#e6edf3; --mut:#8b98a9;
          --accent:#ff6a00; --fast:#3fb0ff; --deep:#c07cff; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); background:var(--panel);
           display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; font-weight:650; }
  header .bike { color:var(--mut); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px;
         max-width:820px; width:100%; margin:0 auto; }
  .msg { display:flex; gap:10px; }
  .msg .who { flex:0 0 auto; font-size:12px; color:var(--mut); width:52px; padding-top:2px; }
  .msg .body { white-space:pre-wrap; }
  .msg.user .body { color:#cfe3ff; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; margin-bottom:4px; }
  .badge.fast { background:rgba(63,176,255,.15); color:var(--fast); }
  .badge.deep { background:rgba(192,124,255,.15); color:var(--deep); }
  form { border-top:1px solid var(--line); background:var(--panel); padding:12px;
         display:flex; gap:8px; max-width:820px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; background:var(--bg); color:var(--ink); border:1px solid var(--line);
             border-radius:8px; padding:10px 12px; font:inherit; min-height:44px; max-height:160px; }
  select, button { background:var(--bg); color:var(--ink); border:1px solid var(--line);
                   border-radius:8px; padding:0 14px; font:inherit; cursor:pointer; }
  button.send { background:var(--accent); color:#111; border-color:var(--accent); font-weight:650; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--mut); font-size:12px; text-align:center; padding:6px; }
</style>
</head>
<body>
  <header>
    <span style="font-size:20px">🏍️</span>
    <h1>ThunderMax Tuning Assistant</h1>
    <span class="bike" id="bike">…</span>
  </header>
  <div id="log">
    <div class="hint">Ask a tuning question about your bike. Auto-routes to the fast model for
      lookups, the 70B for deep strategy.</div>
  </div>
  <form id="f">
    <textarea id="q" placeholder="e.g. why do I get decel pops above 4k rpm?" autofocus></textarea>
    <select id="mode" title="model routing">
      <option value="auto">Auto</option>
      <option value="fast">⚡ Fast</option>
      <option value="deep">🧠 Deep</option>
    </select>
    <button class="send" id="send">Ask</button>
  </form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('f');
const qEl = document.getElementById('q');
const modeEl = document.getElementById('mode');
const sendBtn = document.getElementById('send');

// same-origin API — no host needed since the frontend is served by the API
const API = '';

fetch(API + '/api/profile').then(r => r.json())
  .then(p => document.getElementById('bike').textContent = p.label || '')
  .catch(() => {});

function addMsg(who, cls) {
  const m = document.createElement('div');
  m.className = 'msg ' + (cls || '');
  m.innerHTML = `<div class="who">${who}</div><div class="body"></div>`;
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return m.querySelector('.body');
}

async function ask(question, mode) {
  addMsg('you', 'user').textContent = question;
  const body = addMsg('tmax');
  try {
    const res = await fetch(API + '/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, mode }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line) continue;
        const msg = JSON.parse(line);
        if (msg.type === 'model') {
          const b = document.createElement('div');
          b.className = 'badge ' + msg.tier;
          b.textContent = (msg.tier === 'deep' ? '🧠 ' : '⚡ ') + msg.model;
          body.parentElement.insertBefore(b, body);
        } else if (msg.type === 'token') {
          body.textContent += msg.t;
          log.scrollTop = log.scrollHeight;
        } else if (msg.type === 'error') {
          body.textContent += '\n[error] ' + msg.error;
        }
      }
    }
  } catch (e) {
    body.textContent += '\n[connection error] ' + e.message;
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = qEl.value.trim();
  if (!q) return;
  qEl.value = '';
  sendBtn.disabled = true;
  await ask(q, modeEl.value);
  sendBtn.disabled = false;
  qEl.focus();
});
qEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
</script>
</body>
</html>
