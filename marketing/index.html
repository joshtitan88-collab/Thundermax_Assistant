function useReveal() {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (typeof IntersectionObserver === 'undefined') { setShown(true); return; }
    const io = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setShown(true); io.disconnect(); } },
      { threshold: 0.12, rootMargin: '0px 0px -60px 0px' }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return [ref, shown];
}

function Reveal({ children, delay = 0, className = '', as: Tag = 'div' }) {
  const [ref, shown] = useReveal();
  return (
    <Tag
      ref={ref}
      className={`reveal ${shown ? 'is-visible' : ''} ${className}`}
      style={{ transitionDelay: `${delay}ms` }}
    >
      {children}
    </Tag>
  );
}

function Button({ children, href = '#signup', variant = 'primary', className = '', ...rest }) {
  const base =
    'btn-press inline-flex items-center justify-center gap-2 rounded-xl font-semibold ' +
    'focus:outline-none focus-visible:ring-4 focus-visible:ring-brand-500/30';
  const styles = {
    primary:

    secondary:
      'border border-slate-200 bg-white px-6 py-3.5 text-slate-700 shadow-soft hover:border-slate-300 hover:text-slate-900',
    nav:
      'bg-brand-600 px-4 py-2.5 text-sm text-white shadow-soft hover:bg-brand-700',
  };
  return (
    <a href={href} className={`${base} ${styles[variant]} ${className}`} {...rest}>
      {children}
    </a>
  );
}

function Section({ id, children, className = '' }) {
  return (
    <section id={id} className={`mx-auto w-full max-w-6xl px-5 sm:px-8 ${className}`}>
      {children}

}

}

function useCountUp(target, run, duration = 1500) {
  const [value, setValue] = useState(0);
  useEffect(() => {
    if (!run) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setValue(target);
      return;
    }
    let raf, start = null;
    const tick = (t) => {
      if (start === null) start = t;
      const p = Math.min((t - start) / duration, 1);
      setValue(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [run, target, duration]);
  return value;
}

const STATS = [
  { target: 2400,  format: (v) => Math.round(v).toLocaleString() + '+', label: 'riders tuning with it' },
  { target: 18000, format: (v) => Math.round(v).toLocaleString(),       label: 'tunes decoded' },
  { target: 0,     format: () => '0',                                   label: '.tbw files ever modified' },
  { target: 4.9,   format: (v) => v.toFixed(1) + '/5',                  label: 'average shop rating' },
];

function StatItem({ stat, run, delay }) {
  const v = useCountUp(stat.target, run);
  return (
    <Reveal delay={delay}>

        <p className="mx-auto mt-2 max-w-[10rem] text-sm font-medium leading-snug text-brand-200">{stat.label}</p>
      </div>
    </Reveal>
  );
}
